name: Add Flux language support

on:
  push:
    paths:
      - 'public/flux-fox.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Flux language support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/main.jsx')
          s = p.read_text()
          s = s.replace("['javascript','JavaScript'],", "['javascript','JavaScript'],['flux','Flux'],", 1)
          s = s.replace("js:'javascript',jsx:'javascript'", "flux:'flux',js:'javascript',jsx:'javascript'", 1)
          old = "function FileIcon({name}){const ext=name.toLowerCase().split('.').pop();const type=ext==='json'?'json'"
          new = "function FileIcon({name}){const ext=name.toLowerCase().split('.').pop();if(ext==='flux')return <span className=\"file-icon file-icon-flux\"><img src={`${import.meta.env.BASE_URL}flux-fox.svg`} alt=\"Flux\"/></span>;const type=ext==='json'?'json'"
          s = s.replace(old, new, 1)
          marker = "beforeMount={monaco=>{monaco.editor.defineTheme"
          inject = "beforeMount={monaco=>{monaco.languages.register({id:'flux',extensions:['.flux']});monaco.languages.setMonarchTokensProvider('flux',{tokenizer:{root:[[/\\/\\/.*$/,'comment'],[/\"[^\"]*\"/,'string'],[/\\b(function|let|const|if|else|return|true|false)\\b/,'keyword'],[/\\b\\d+(\\.\\d+)?\\b/,'number']]}});monaco.editor.defineTheme"
          s = s.replace(marker, inject, 1)
          s = s.replace('<div className="brand">FluxIDE <span>WEB</span></div>', '<div className="brand"><img src={`${import.meta.env.BASE_URL}flux-fox.svg`} alt="Flux"/> FluxIDE <span>WEB</span></div>', 1)
          p.write_text(s)
          PY
      - name: Add Flux icon styling
        run: |
          cat >> src/styles.css <<'CSS'
          .file-icon-flux img { width: 16px; height: 16px; display: block; object-fit: contain; }
          .brand img { width: 24px; height: 24px; display: block; object-fit: contain; }
          CSS
      - name: Commit Flux support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'Add Flux language and fox branding [skip ci]'
          git push
