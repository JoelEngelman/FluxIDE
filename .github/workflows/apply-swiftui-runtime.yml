name: Apply FluxIDE SwiftUI runtime patch

on:
  push:
    paths:
      - .fluxide-apply-swiftui

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply FluxIDE SwiftUI runtime patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch FluxIDE
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.jsx')
          text = main.read_text(encoding='utf-8')

          import_line = "import './styles.css';"
          runtime_import = "import './styles.css';\nimport { runSwiftUIPreview } from './swiftui-runtime';"
          if "./swiftui-runtime" not in text:
              text = text.replace(import_line, runtime_import, 1)

          old_save = '''  function save() {\n    setHistory((current) => [...current, { file: active, time: new Date().toLocaleTimeString() }].slice(-30));\n    setFiles((current) => ({ ...current, [active]: draft }));\n    setOutput(`✓ Saved ${active}`);\n  }'''
          new_save = '''  async function save() {\n    setHistory((current) => [...current, { file: active, time: new Date().toLocaleTimeString() }].slice(-30));\n    setFiles((current) => ({ ...current, [active]: draft }));\n\n    try {\n      if ('showSaveFilePicker' in window) {\n        const picker = await window.showSaveFilePicker({\n          suggestedName: active,\n          types: [{ description: 'Source file', accept: { 'text/plain': [`.${active.includes('.') ? active.split('.').pop() : 'txt'}`] } }]\n        });\n        const writable = await picker.createWritable();\n        await writable.write(draft);\n        await writable.close();\n        setOutput(`✓ Saved ${active} to ${picker.name}`);\n        return;\n      }\n    } catch (error) {\n      if (error?.name === 'AbortError') {\n        setOutput('Save cancelled.');\n        return;\n      }\n      console.warn('File System Access save failed:', error);\n    }\n\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(new Blob([draft], { type: 'text/plain' }));\n    link.download = active;\n    link.click();\n    URL.revokeObjectURL(link.href);\n    setOutput(`✓ Downloaded ${active} (browser fallback)`);\n  }'''
          if old_save in text:
              text = text.replace(old_save, new_save, 1)
          else:
              raise SystemExit('Save function did not match current main.jsx')

          old_swift = '''    if (language === 'swift' && /(^|\\n)\\s*(import\\s+(SwiftUI|UIKit|AppKit)|@main\\b|struct\\s+\\w+\\s*:\\s*(View|App)|UIViewController\\b)/m.test(draft)) {\n      setOutput(\n        '🍎 SwiftUI / Apple SDK detected.\\n\\n' +\n        'FluxIDE can edit and syntax-highlight this Swift file, but the current Swift runner does not include Apple\\'s iOS/macOS SDKs.\\n\\n' +\n        'Editing & syntax highlighting: ✓\\n' +\n        'Standard Swift compilation: ✓\\n' +\n        'SwiftUI / UIKit / AppKit compilation: ⚠ Requires macOS + Xcode\\n\\n' +\n        'The previous compiler error ("no such module SwiftUI") happens because SwiftUI is supplied by Apple\\'s SDK, not by the standalone Swift compiler.\\n\\n' +\n        'For a real iPhone app, open the project on a Mac in Xcode.'\n      );\n      return;\n    }'''
          new_swift = '''    if (language === 'swift' && /(^|\\n)\\s*(import\\s+(SwiftUI|UIKit|AppKit)|@main\\b|struct\\s+\\w+\\s*:\\s*(View|App)|UIViewController\\b)/m.test(draft)) {\n      runSwiftUIPreview(draft, {\n        title: active.replace(/\\.swift$/i, ''),\n        setOutput,\n        onError: (error) => setOutput(`SwiftUI preview error: ${error.message}`)\n      });\n      return;\n    }'''
          if old_swift in text:
              text = text.replace(old_swift, new_swift, 1)
          else:
              raise SystemExit('SwiftUI run block did not match current main.jsx')

          main.write_text(text, encoding='utf-8')

          runtime = Path('src/swiftui-runtime.js')
          runtime.write_text(r'''const CSS = `
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f2f2f7; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } }
  .swift-preview { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
  .iphone { width:min(390px, 92vw); min-height:760px; max-height:88vh; overflow:auto; border-radius:42px; background:#fff; color:#111; box-shadow:0 25px 70px #0006; border:8px solid #111; position:relative; }
  .iphone:before { content:""; display:block; width:110px; height:25px; border-radius:20px; background:#111; position:sticky; top:0; left:50%; transform:translateX(-50%); z-index:5; margin-bottom:-25px; }
  .swift-content { min-height:744px; padding:54px 22px 28px; }
  .swift-vstack { display:flex; flex-direction:column; gap:14px; align-items:stretch; }
  .swift-hstack { display:flex; flex-direction:row; gap:12px; align-items:center; flex-wrap:wrap; }
  .swift-zstack { display:grid; place-items:center; }
  .swift-text { font-size:17px; line-height:1.35; }
  .swift-title { font-size:34px; font-weight:700; letter-spacing:-1px; }
  .swift-button { border:0; border-radius:12px; padding:11px 17px; font:inherit; background:#007aff; color:#fff; cursor:pointer; }
  .swift-button:active { transform:scale(.98); }
  .swift-image { width:42px; height:42px; display:grid; place-items:center; font-size:34px; }
  .swift-divider { height:1px; background:#ddd; width:100%; }
  .swift-spacer { flex:1; min-height:18px; }
  .swift-field { width:100%; padding:12px 14px; border:1px solid #ccc; border-radius:10px; font:inherit; }
  .swift-card { padding:18px; border-radius:18px; background:#f2f2f7; }
`;

function stripSwift(source) {
  return source
    .replace(/\/\/.*$/gm, '')
    .replace(/\/\*[\\s\\S]*?\*\//g, '')
    .replace(/^\s*import\s+[^\n]+/gm, '')
    .replace(/@main\s*/g, '')
    .replace(/struct\s+\w+\s*:\s*(?:View|App)[^{]*\{/g, '')
    .replace(/var\s+body\s*:\s*some\s+View\s*\{/g, '')
    .replace(/var\s+body\s*:\s*some\s+Scene\s*\{/g, '')
    .replace(/WindowGroup\s*\{/g, 'VSTACK {');
}

function swiftText(value) {
  return String(value || '').replace(/^\s*["']|["']\s*$/g, '').replace(/\\n/g, '\n').replace(/\\"/g, '"');
}

function extractQuoted(rest) {
  const match = rest.match(/["']([\\s\\S]*?)["']/);
  return match ? swiftText(match[1]) : '';
}

function renderView(source) {
  const root = document.createElement('div');
  root.className = 'swift-vstack';
  const stack = [root];
  const lines = stripSwift(source).split(/\r?\n/).map((line) => line.trim()).filter(Boolean);

  for (let line of lines) {
    if (/^VStack\b/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-vstack';
      stack[stack.length - 1].appendChild(el); stack.push(el); continue;
    }
    if (/^HStack\b/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-hstack';
      stack[stack.length - 1].appendChild(el); stack.push(el); continue;
    }
    if (/^ZStack\b/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-zstack';
      stack[stack.length - 1].appendChild(el); stack.push(el); continue;
    }
    if (/^}\s*$/.test(line) || /^\}\s*\.?(padding|frame|background|foregroundColor|font)/.test(line)) {
      if (stack.length > 1) stack.pop();
      continue;
    }
    if (/^Spacer\s*\(/.test(line) || /^Spacer\s*$/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-spacer'; stack[stack.length - 1].appendChild(el); continue;
    }
    if (/^Divider\s*\(/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-divider'; stack[stack.length - 1].appendChild(el); continue;
    }
    let match = line.match(/^Text\s*\(\s*["']([\\s\\S]*?)["']/);
    if (match) {
      const el = document.createElement('div'); el.className = 'swift-text'; el.textContent = swiftText(match[1]);
      if (/\.font\s*\(\s*\.largeTitle|\.largeTitle/.test(line)) el.classList.add('swift-title');
      stack[stack.length - 1].appendChild(el); continue;
    }
    match = line.match(/^Button\s*\(\s*["']([\\s\\S]*?)["']/);
    if (match) {
      const el = document.createElement('button'); el.className = 'swift-button'; el.textContent = swiftText(match[1]);
      el.addEventListener('click', () => { el.textContent = `${swiftText(match[1])} ✓`; });
      stack[stack.length - 1].appendChild(el); continue;
    }
    match = line.match(/^Image\s*\(\s*systemName:\s*["']([^"']+)["']/);
    if (match) {
      const el = document.createElement('div'); el.className = 'swift-image';
      const symbols = { star:'⭐', heart:'❤️', person:'👤', house:'⌂', gear:'⚙️', plus:'＋', checkmark:'✓', globe:'🌐', bolt:'⚡' };
      el.textContent = symbols[match[1]] || '◉'; stack[stack.length - 1].appendChild(el); continue;
    }
    match = line.match(/^TextField\s*\(\s*["']([^"']*)["']/);
    if (match) {
      const el = document.createElement('input'); el.className = 'swift-field'; el.placeholder = swiftText(match[1]); stack[stack.length - 1].appendChild(el); continue;
    }
    if (/^Form\s*\{/.test(line) || /^List\s*\{/.test(line) || /^ScrollView/.test(line)) {
      const el = document.createElement('div'); el.className = 'swift-card'; stack[stack.length - 1].appendChild(el); stack.push(el); continue;
    }
  }
  return root;
}

export function runSwiftUIPreview(source, { title = 'SwiftUI App', setOutput, onError } = {}) {
  try {
    const preview = window.open('', '_blank');
    if (!preview) { setOutput?.('SwiftUI preview was blocked by the browser. Allow pop-ups for FluxIDE.'); return; }
    preview.document.open();
    preview.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>${CSS}</style></head><body><div class="swift-preview"><div class="iphone"><div class="swift-content" id="swift-root"></div></div></div></body></html>`);
    preview.document.close();
    const root = preview.document.getElementById('swift-root');
    root.appendChild(renderView(source));
    setOutput?.(`✓ SwiftUI preview opened for ${title}.\n\nFluxIDE is rendering the SwiftUI view tree with its own browser runtime — no Xcode or macOS required.`);
  } catch (error) {
    onError?.(error);
  }
}
''', encoding='utf-8')

          Path('.fluxide-apply-swiftui').unlink(missing_ok=True)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/swiftui-runtime.js .fluxide-apply-swiftui
          git commit -m "Apply FluxIDE SwiftUI runtime patch" || exit 0
          git push
